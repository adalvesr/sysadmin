[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberark-pvwa-toolkit"
version = "1.0.0"
description = "CyberArk PVWA account administration toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
pvwa-toolkit = "cyberark_cli:main"

[tool.setuptools]
py-modules = ["cyberark_cli", "cyberark_config", "cyberark_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

