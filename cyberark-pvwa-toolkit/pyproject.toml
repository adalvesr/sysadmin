[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberark-pvwa-toolkit"
version = "1.0.0"
description = "CyberArk PVWA account administration toolkit"
requires-python = ">=3.9"
dependencies = [
    "requests==2.32.5",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["ruff==0.13.1"]

[project.scripts]
pvwa-toolkit = "cyberark_cli:main"

[tool.setuptools]
py-modules = ["cyberark_cli", "cyberark_config", "cyberark_utils"]

[tool.ruff]
line-length = 100
target-version = "py39"

