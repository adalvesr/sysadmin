version: 1
connection: production

# The playbook supplies policy; the caller supplies -H/--hostname or -f/--file.
required-selectors:
  - addresses

tasks:
  - name: Configure discovered SSH-key accounts
    target: accounts

    select:
      platforms:
        - UnixSSH
        - UnixSSHKeys

      discovery-platform-types:
        - Unix SSH Key

      where:
        - field: user
          regex: "^(root|oracle)$"

      exclude:
        accounts:
          - svc_reconcile
        where:
          - field: safe
            regex: "^Retired-"

    actions:
      - list:
          fields:
            - id
            - user
            - address
            - safe
            - platform

      - change-platform:
          platform: UnixSSHKeys

      - set-management:
          enabled: false
          reason: SSH key account

      - link-account:
          role: reconcile
          source:
            account: svc_reconcile
            same-address: true

      - reconcile: {}
